name: Build Windows Installer

# Every push to main builds a test installer (downloadable as a workflow
# artifact, which needs a GitHub login and expires). Pushing a version tag
# (e.g. v1.0.0) also publishes it as a GitHub Release -- public, no login,
# permanent -- which is what to share with other users.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:  # GitHub doesn't apply path filters to tag pushes, so tags always build
      - "client/**"
      - "shared/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write  # needed to create releases
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ../shared
          pip install pyinstaller

      - name: Build app with PyInstaller
        run: pyinstaller packaging/mis_pulse.spec --noconfirm

      - name: Build installer with Inno Setup
        run: |
          $version = "0.1.0"
          if ($env:GITHUB_REF -like "refs/tags/v*") { $version = $env:GITHUB_REF_NAME.Substring(1) }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging\installer.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: FCG-MIS-Pulse-Setup
          path: client/installer_output/*.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$env:GITHUB_REF_NAME" "installer_output/FCG-MIS-Pulse-Setup.exe" --title "FCG MIS Pulse $env:GITHUB_REF_NAME" --generate-notes
